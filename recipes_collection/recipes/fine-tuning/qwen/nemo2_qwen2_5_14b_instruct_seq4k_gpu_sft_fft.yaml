# NeMo 2.0 Qwen2.5-Coder-14B function-calling SFT (full fine-tune).

display_name: "NeMo 2.0 Qwen2.5-Coder-14B Instruct Function-Calling SFT (FFT)"
version: "1.0.0"
instance_types: ["ml.p4d.24xlarge", "ml.p5.48xlarge"]

defaults:
  - _self_
  - /cluster@cluster.cluster_config: k8s

run:
  name: nemo2-qwen25-fc-sft
  model_type: nemo2
  results_dir: ${base_results_dir}/${.name}
  nodes: 1
  ntasks_per_node: 8

trainer:
  devices: 8
  num_nodes: 1

entry_script: examples/nemo2/qwen25_fc_sft.py

script_args:
  - --dataset-root: ${oc.env:FC_NEMO2_DATASET_ROOT,""}
  - --output-dir: ${recipes.run.results_dir}
  - --hf-model-id: ${oc.env:FC_NEMO2_HF_MODEL_ID,"Qwen/Qwen2.5-Coder-14B-Instruct"}
  - --import-output: ${oc.env:FC_NEMO2_IMPORT_OUTPUT,${recipes.run.results_dir}/checkpoints/qwen25_14b_instruct.nemo}
  - --restore-path: ${oc.env:FC_NEMO2_IMPORT_OUTPUT,${recipes.run.results_dir}/checkpoints/qwen25_14b_instruct.nemo}
  - --seq-length: ${oc.env:FC_NEMO2_SEQ_LEN,4096}
  - --micro-batch-size: ${oc.env:FC_NEMO2_MICRO_BS,1}
  - --global-batch-size: ${oc.env:FC_NEMO2_GLOBAL_BS,8}
  - --max-steps: ${oc.env:FC_NEMO2_MAX_STEPS,5064}
  - --learning-rate: ${oc.env:FC_NEMO2_LR,1e-5}
  - --warmup-steps: ${oc.env:FC_NEMO2_WARMUP_STEPS,150}
  - --recompute-granularity: ${oc.env:FC_NEMO2_RECOMPUTE_GRANULARITY,"selective"}
  - --recompute-method: ${oc.env:FC_NEMO2_RECOMPUTE_METHOD,"none"}
  - --recompute-num-layers: ${oc.env:FC_NEMO2_RECOMPUTE_NUM_LAYERS,0}
  - --gradient-accumulation-fusion: ${oc.env:FC_NEMO2_GRAD_ACCUM_FUSION,"false"}
  - --val-check-interval: ${oc.env:FC_NEMO2_VAL_CHECK_INTERVAL,1.0}
  - --log-every-n-steps: ${oc.env:FC_NEMO2_LOG_EVERY_N_STEPS,1}
  - --num-workers: ${oc.env:FC_NEMO2_NUM_WORKERS,2}
  - --peft-scheme: ${oc.env:FC_NEMO2_PEFT,"none"}
  - --seed: ${oc.env:FC_NEMO2_SEED,42}

##########################################################################################
###         The following configurations are used in elastic training only
##########################################################################################
elastic_policy:
  is_elastic: false
  min_nodes: 1
  max_nodes: 16
  replica_increment_step: 1
  use_graceful_shutdown: true
  scaling_timeout: 1800
  graceful_shutdown_timeout: 600
